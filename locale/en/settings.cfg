[mod-setting-name]
rrec-full-recording-mode=Full recording mode
rrec-combat-radius=Combat detection radius (tiles)
rrec-zone-timeout-seconds=Zone timeout (seconds)
rrec-distant-sample-interval-seconds=Distant sample interval (seconds)
rrec-network-activity-window-seconds=Network activity window (seconds)
rrec-chain-near-hops=Chain near hops
rrec-chain-max-hops=Chain max hops
rrec-inserter-search-radius=Inserter search radius (tiles)
rrec-chunk-backfill-per-tick=Chunk backfill per tick
rrec-flush-interval-seconds=Flush interval (seconds)
rrec-diagnostics-enabled=Diagnostics enabled
rrec-battlefield-marker-enabled=Battlefield marker enabled
rrec-max-buffered-events=Max buffered events
rrec-nest-cluster-radius=Nest cluster radius (tiles)

[mod-setting-description]
rrec-full-recording-mode=Records every entity on every generated chunk, every tick, instead of only combat zones. WARNING: this produces enormous replay files (potentially gigabytes per hour) and is intended for short recordings or debugging, not routine play.
rrec-combat-radius=How close a player (on foot or driving a vehicle) must be to a fight before it starts being recorded. Smaller values crop more aggressively and keep files smaller; larger values catch more of the action but grow the replay file faster.
rrec-zone-timeout-seconds=How long a battlefield keeps recording after the last hit before it goes quiet again. Raise this if replays cut off while a fight is still visibly happening; lower it to shrink file size.
rrec-distant-sample-interval-seconds=How often logistics network contents, far-chain item rollups, and fluid segments are re-sampled. Lower for fresher distant data at the cost of file size; higher to shrink it.
rrec-network-activity-window-seconds=How long a logistics network keeps counting as reachable after it was last seen with any robots, so it doesn't flicker in and out just because its robots are briefly mid-delivery.
rrec-chain-near-hops=Belt/inserter chain hops within this distance of a zone get exact per-entity tracking; beyond it, they're rolled up into a compact summary instead.
rrec-chain-max-hops=Absolute limit on how far a belt/inserter chain walk follows outward from a zone, near or far.
rrec-inserter-search-radius=How far to search around a chest for inserters that service it. Only narrows the search - matches are confirmed via each candidate's exact pickup/drop target, so a too-large radius costs a little performance, not correctness.
rrec-chunk-backfill-per-tick=When full recording mode turns on with already-generated chunks in the save, how many of them get scanned and captured per tick while catching up.
rrec-flush-interval-seconds=How often the buffered event queue gets serialized and written to replay.json, at most - see "Max buffered events" for the other trigger.
rrec-diagnostics-enabled=Writes per-tick performance timing to Factorio's own log file, not replay.json. Only useful when chasing a performance problem.
rrec-battlefield-marker-enabled=Draws a cyan line around the exterior perimeter of whatever chunks are currently recording. Purely visual - has no effect on what gets recorded. No effect under full recording mode.
rrec-max-buffered-events=Caps how many buffered events a single flush serializes and writes, and triggers an early flush once the buffer grows past this size.
rrec-nest-cluster-radius=How close two captured nests need to be to get grouped into the same rough "base" in a chunk snapshot. Smaller values split nests into more, smaller clusters; larger values merge more of them together.
