[mod-setting-name]
rrec-full-recording-mode=Full recording mode
rrec-combat-radius=Combat detection radius (tiles)
rrec-zone-timeout-seconds=Zone timeout (seconds)
rrec-nest-cluster-radius=Nest cluster radius (tiles)

[mod-setting-description]
rrec-full-recording-mode=Records every entity on every generated chunk, every tick, instead of only combat zones. WARNING: this produces enormous replay files (potentially gigabytes per hour) and is intended for short recordings or debugging, not routine play.
rrec-combat-radius=How close a player (on foot or driving a vehicle) must be to a fight before it starts being recorded. Smaller values crop more aggressively and keep files smaller; larger values catch more of the action but grow the replay file faster.
rrec-zone-timeout-seconds=How long a battlefield keeps recording after the last hit before it goes quiet again. Raise this if replays cut off while a fight is still visibly happening; lower it to shrink file size.
rrec-nest-cluster-radius=How close two captured nests need to be to get grouped into the same rough "base" in a chunk snapshot. Smaller values split nests into more, smaller clusters; larger values merge more of them together.
